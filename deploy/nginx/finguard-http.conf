# Initial HTTP configuration for IP testing and ACME certificate issuance.
# Run deploy/scripts/enable-https.sh after the domain points to this VM.
limit_req_zone $binary_remote_addr zone=finguard_api_per_ip:1m rate=30r/m;
map $uri $finguard_auth_limit_key {
    default "";
    ~^/api/v1/auth/(?:login|register|google|refresh)$ $binary_remote_addr;
}
limit_req_zone $finguard_auth_limit_key zone=finguard_auth_per_ip:1m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/finguard/web;
    index index.html;
    charset utf-8;
    client_max_body_size 5m;
    client_body_timeout 15s;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /api/ {
        limit_req zone=finguard_api_per_ip burst=20 nodelay;
        limit_req zone=finguard_auth_per_ip burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Proxy "";
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
    }

    location = /api {
        return 308 /api/;
    }

    location ~ ^/(?:index\.html|flutter_service_worker\.js|manifest\.json|version\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
}
