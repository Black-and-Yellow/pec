# Bootstrap-only HTTP configuration for ACME certificate issuance.
# It intentionally exposes no FinGuard API or interactive application.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 503 "FinGuard is unavailable until HTTPS is enabled.\n";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
}
