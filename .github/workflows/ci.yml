name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      device_api_base_url:
        description: >-
          Base URL the installable test APK should talk to, for example
          https://your-tunnel.trycloudflare.com/ or http://192.168.1.5:8000/
          on the same Wi-Fi. Plain HTTP is accepted because the artifact is a
          debug build; release builds still require HTTPS.
        required: false
        default: "http://10.0.2.2:8000/"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints-production.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            --constraint constraints-production.txt \
            --upgrade pip==26.2.1 \
            --editable ".[dev]"
          python -m pip check

      - name: Run Ruff
        run: python -m ruff check .

      - name: Audit Python dependencies
        run: python -m pip_audit --local --progress-spinner off

      - name: Type-check backend
        run: python -m mypy app

      - name: Run backend tests with coverage
        run: python -m pytest -p no:cacheprovider --cov=app --cov-branch --cov-report=term-missing

  flutter:
    name: Flutter analyze, tests, and release builds
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Verify aggregate Android release tasks fail closed
        run: |
          set -Eeuo pipefail
          if output="$(./android/gradlew -p android assemble --dry-run --no-daemon --console=plain 2>&1)"; then
            printf '%s\n' "${output}" >&2
            echo 'Aggregate assemble unexpectedly bypassed release configuration checks.' >&2
            exit 1
          fi
          if ! grep -Fq 'Android release builds require --dart-define=API_BASE_URL=https://<host>[/base-path].' \
            <<<"${output}"; then
            printf '%s\n' "${output}" >&2
            echo 'Aggregate assemble did not fail at the required release configuration boundary.' >&2
            exit 1
          fi
          ./android/gradlew -p android assembleDebug --dry-run --no-daemon --console=plain >/dev/null

      - name: Build Flutter web
        run: flutter build web --release

      - name: Build Android APK
        env:
          # This is compile evidence only. Distribution requires an operator keystore.
          FINGUARD_ALLOW_DEMO_RELEASE: "true"
        run: flutter build apk --release --dart-define=API_BASE_URL=https://example.invalid/

      # An installable artifact for testing on a real handset. It is a debug
      # build on purpose: the release build refuses a non-HTTPS API, and a
      # phone pointed at a laptop on the same Wi-Fi has no certificate.
      - name: Build installable test APK
        run: flutter build apk --debug --dart-define=API_BASE_URL="${DEVICE_API_BASE_URL}"
        env:
          DEVICE_API_BASE_URL: >-
            ${{ github.event.inputs.device_api_base_url || 'http://10.0.2.2:8000/' }}

      - name: Upload installable test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finguard-test-apk
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  web-e2e:
    name: Real-stack Web browser QA
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints-production.txt

      - name: Install backend runtime
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check \
            --constraint constraints-production.txt \
            --upgrade pip==26.2.1 .
          python -m pip check

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Build release Web app for loopback API
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=API_BASE_URL=http://127.0.0.1:8000/

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and audit browser harness
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npx playwright install --with-deps chromium

      - name: Run real-stack Playwright flows
        working-directory: frontend
        env:
          FINGUARD_BACKEND_PYTHON: python
        run: npm run test:e2e

  deployment-assets:
    name: Deployment asset checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate Bash scripts
        run: bash -n deploy/scripts/*.sh deploy/certbot/*.sh

      - name: Verify release anti-replay contract
        run: bash deploy/scripts/test-release-metadata.sh

      - name: Verify amd64 release architecture contract
        run: bash deploy/scripts/test-release-architecture.sh

      - name: Verify restricted SSH transport contract
        run: bash deploy/scripts/test-deploy-transport.sh

      - name: Verify HTTPS template refresh contract
        run: bash deploy/scripts/test-https-config.sh

      - name: Validate deployment templates
        run: |
          set -Eeuo pipefail
          grep -Fq '__FINGUARD_DOMAIN__' deploy/nginx/finguard-https.conf.template
          http_config=deploy/nginx/finguard-http.conf
          https_config=deploy/nginx/finguard-https.conf.template
          grep -Fq '/.well-known/acme-challenge/' "${http_config}"
          grep -Fq 'return 503' "${http_config}"
          ! grep -Fq 'proxy_pass' "${http_config}"
          ! grep -Fq 'root /opt/finguard/web' "${http_config}"
          ! grep -Fq 'try_files $uri $uri/ /index.html' "${http_config}"
          grep -Fq 'proxy_pass http://127.0.0.1:8000;' "${https_config}"
          grep -Fq 'limit_req zone=finguard_api_per_ip' "${https_config}"
          grep -Fq 'limit_req zone=finguard_auth_per_ip' "${https_config}"
          grep -Fq 'map $uri $finguard_auth_global_limit_key' "${https_config}"
          grep -Fq '~^/api/v1/auth/(?:login|register|google|refresh)$ finguard-auth-global;' "${https_config}"
          grep -Fq 'limit_req_zone $finguard_auth_global_limit_key zone=finguard_auth_global:1m rate=30r/m;' "${https_config}"
          grep -Fq 'limit_req zone=finguard_auth_global burst=10 nodelay;' "${https_config}"
          grep -Fq 'map $request_method $finguard_ai_limit_key' "${https_config}"
          grep -Fq 'limit_req_zone $finguard_ai_limit_key zone=finguard_ai_per_ip:1m rate=2r/m;' "${https_config}"
          grep -Fq 'location = /api/v1/context/analyze' "${https_config}"
          grep -Fq 'limit_req zone=finguard_ai_per_ip burst=1 nodelay;' "${https_config}"
          test "$(grep -Fc 'limit_req zone=finguard_api_per_ip burst=20 nodelay;' "${https_config}")" -eq 2
          test "$(grep -Fc 'limit_req zone=finguard_auth_per_ip burst=5 nodelay;' "${https_config}")" -eq 1
          test "$(grep -Fc 'limit_req zone=finguard_auth_global burst=10 nodelay;' "${https_config}")" -eq 1
          grep -Fq 'ENABLE_AI_CONTEXT=false' .env.example
          grep -Fq 'ENABLE_AI_CONTEXT=false' deploy/finguard.env.example
          grep -Fxq 'MAX_REGISTERED_USERS=5000' deploy/finguard.env.example
          grep -Fq 'return 308 https://__FINGUARD_DOMAIN__$request_uri;' "${https_config}"
          grep -Fq 'readonly BUILD_USER="finguard-build"' deploy/scripts/setup-oci.sh
          grep -Fq 'readonly BUILD_GROUP="finguard-build"' deploy/scripts/setup-oci.sh
          grep -Fq 'readonly ALLOWED_SIGNERS_FILE="${CONFIG_ROOT}/release_allowed_signers"' deploy/scripts/setup-oci.sh
          grep -Fq 'install -o root -g root -m 0600 /dev/null "${ALLOWED_SIGNERS_FILE}"' deploy/scripts/setup-oci.sh
          grep -Fq 'readonly RELEASE_SIGNER_IDENTITY="finguard-ci"' deploy/scripts/deploy-release.sh
          grep -Fq 'readonly RELEASE_SIGNATURE_NAMESPACE="finguard-release"' deploy/scripts/deploy-release.sh
          grep -Fq '[[ -f "${SIGNATURE}" && ! -L "${SIGNATURE}" ]]' deploy/scripts/deploy-release.sh
          grep -Fq '[[ -f "${ALLOWED_SIGNERS_FILE}" && ! -L "${ALLOWED_SIGNERS_FILE}" ]]' deploy/scripts/deploy-release.sh
          grep -Fq 'release allowed-signers file must be root:root mode 0600' deploy/scripts/deploy-release.sh
          grep -Fq 'production AUTH_SECRET_KEY must replace the documented placeholder' deploy/scripts/deploy-release.sh
          grep -Fq 'signature_size > 0 && signature_size <= 16384' deploy/scripts/deploy-release.sh
          grep -Fq -- '-----BEGIN SSH SIGNATURE-----' deploy/scripts/deploy-release.sh
          grep -Fq -- '-----END SSH SIGNATURE-----' deploy/scripts/deploy-release.sh
          grep -Fq 'ssh-keygen -Y verify' deploy/scripts/deploy-release.sh
          grep -Fq -- '-I "${RELEASE_SIGNER_IDENTITY}"' deploy/scripts/deploy-release.sh
          grep -Fq -- '-n "${RELEASE_SIGNATURE_NAMESPACE}"' deploy/scripts/deploy-release.sh
          verify_line="$(grep -nF 'ssh-keygen -Y verify' deploy/scripts/deploy-release.sh | cut -d: -f1)"
          list_line="$(grep -nF 'tar --list --gzip' deploy/scripts/deploy-release.sh | cut -d: -f1)"
          test -n "${verify_line}" && test -n "${list_line}" && test "${verify_line}" -lt "${list_line}"
          grep -Fq 'RELEASE_SIGNING_KEY:' .github/workflows/deploy.yml
          grep -Fq 'secrets.RELEASE_SIGNING_KEY' .github/workflows/deploy.yml
          grep -Fq 'ssh-keygen -Y sign' .github/workflows/deploy.yml
          grep -Fq -- '-n finguard-release' .github/workflows/deploy.yml
          grep -Fq 'finguard-release.tgz.sig' .github/workflows/deploy.yml
          grep -Fq 'Release signing and SSH transport keys must be distinct' .github/workflows/deploy.yml
          grep -Fq '"${RUNNER_TEMP}/finguard_release_signing_key"' .github/workflows/deploy.yml
          grep -Fq 'Build and prove complete amd64 Python wheelhouse' .github/workflows/deploy.yml
          grep -Fq 'release/python-wheelhouse/requirements.txt' .github/workflows/deploy.yml
          grep -Fq 'manylinux_2_${glibc_minor}_x86_64' .github/workflows/deploy.yml
          grep -Fq 'manylinux2014_x86_64' .github/workflows/deploy.yml
          grep -Fq -- '--only-binary=:all:' .github/workflows/deploy.yml
          grep -Fq -- '--no-index' .github/workflows/deploy.yml
          grep -Fq 'sha256sum --check --strict SHA256SUMS' .github/workflows/deploy.yml
          grep -Fq 'setuptools==80.9.0' backend/constraints-production.txt
          grep -Fq -- '--shell /usr/sbin/nologin' deploy/scripts/setup-oci.sh
          grep -Fq -- "--groups ''" deploy/scripts/setup-oci.sh
          grep -Fq 'runuser --user "${BUILD_USER}" -- env -i' deploy/scripts/deploy-release.sh
          grep -Fq 'readonly BUILD_SOURCE_ROOT="${VALIDATION_ROOT}/backend-source"' deploy/scripts/deploy-release.sh
          grep -Fq 'readonly SIGNED_WHEELHOUSE_ROOT="${STAGING_DIR}/python-wheelhouse"' deploy/scripts/deploy-release.sh
          grep -Fq 'readonly OFFLINE_WHEELHOUSE_ROOT="${VALIDATION_ROOT}/python-wheelhouse"' deploy/scripts/deploy-release.sh
          grep -Fq '"${CANDIDATE_DIR}/backend/" "${BUILD_SOURCE_ROOT}/"' deploy/scripts/deploy-release.sh
          grep -Fq 'chown -R --no-dereference "${BUILD_USER}:${BUILD_GROUP}" "${BUILD_SOURCE_ROOT}"' deploy/scripts/deploy-release.sh
          grep -Fq 'chown -R --no-dereference root:"${BUILD_GROUP}" "${OFFLINE_WHEELHOUSE_ROOT}"' deploy/scripts/deploy-release.sh
          grep -Fq 'build account must not be able to modify the signed wheelhouse copy' deploy/scripts/deploy-release.sh
          grep -Fq 'PIP_FIND_LINKS="${OFFLINE_WHEELHOUSE_ROOT}"' deploy/scripts/deploy-release.sh
          grep -Fq 'PIP_NO_INDEX=1' deploy/scripts/deploy-release.sh
          grep -Fq 'PIP_ONLY_BINARY=:all:' deploy/scripts/deploy-release.sh
          test "$(grep -Fc ' -m pip install ' deploy/scripts/deploy-release.sh)" -eq 2
          continuation="$(printf '\\')"
          no_index_count="$(grep -Fc "  --no-index ${continuation}" deploy/scripts/deploy-release.sh)"
          find_links_count="$(grep -Fc "  --find-links \"\${OFFLINE_WHEELHOUSE_ROOT}\" ${continuation}" deploy/scripts/deploy-release.sh)"
          binary_only_count="$(grep -Fc "  --only-binary=:all: ${continuation}" deploy/scripts/deploy-release.sh)"
          test "${no_index_count}" -eq 2
          test "${find_links_count}" -eq 2
          test "${binary_only_count}" -eq 2
          grep -Fq '  --upgrade pip==26.2.1' deploy/scripts/deploy-release.sh
          grep -Fq "  --constraint \"\${BUILD_SOURCE_ROOT}/constraints-production.txt\" ${continuation}" deploy/scripts/deploy-release.sh
          if grep -F ' -m pip install ' deploy/scripts/deploy-release.sh | \
            grep -Fq '${CANDIDATE_DIR}/backend'; then
            echo 'pip must not build from the immutable candidate backend.' >&2
            exit 1
          fi

          for operation in \
            'run_as_build "${VALIDATION_ROOT}" python3 -m venv' \
            'run_as_build "${VALIDATION_ROOT}" "${VENV_PYTHON}" -m pip check' \
            'run_as_build "${VALIDATION_ROOT}" "${VENV_PYTHON}" -m compileall' \
            'run_as_build "${CANDIDATE_DIR}/backend" env "${IMPORT_VALIDATION_ENV[@]}"'; do
            test "$(grep -Fc "${operation}" deploy/scripts/deploy-release.sh)" -eq 1
          done
          for python_marker in \
            'python3 -m venv' \
            '"${VENV_PYTHON}" -m pip check' \
            '"${VENV_PYTHON}" -m compileall' \
            'import app.main'; do
            test "$(grep -Fc "${python_marker}" deploy/scripts/deploy-release.sh)" -eq 1
          done
          test "$(grep -Fc '"${VENV_PYTHON}" -m pip install' deploy/scripts/deploy-release.sh)" -eq 2
          grep -Fq 'DATABASE_URL=sqlite:///${VALIDATION_DB}' deploy/scripts/deploy-release.sh
          grep -Fq 'PYTHONPYCACHEPREFIX="${VALIDATION_ROOT}/pycache"' deploy/scripts/deploy-release.sh
          grep -Fq '"${CANDIDATE_DIR}/backend/app"' deploy/scripts/deploy-release.sh
          grep -Fq 'is_relative_to(Path.cwd().resolve())' deploy/scripts/deploy-release.sh
          grep -Fq 'rm -rf -- "${VALIDATION_ROOT}"' deploy/scripts/deploy-release.sh
          grep -Fq 'for protected_path in "${CONFIG_ROOT}" "${ENV_FILE}" "${STATE_ROOT}" "${BACKEND_ROOT}"' deploy/scripts/deploy-release.sh
          grep -Fq 'build account retained candidate backend access after validation' deploy/scripts/deploy-release.sh
          test "$(grep -Fc 'curl --fail --silent --max-time 3 "${HEALTHCHECK_URL}"' deploy/scripts/deploy-release.sh)" -eq 1
          ! grep -Eq -- '--(index-url|extra-index-url)' deploy/scripts/deploy-release.sh
          verify_line="$(grep -nF 'ssh-keygen -Y verify' deploy/scripts/deploy-release.sh | cut -d: -f1)"
          extract_line="$(grep -nF 'tar --extract --gzip' deploy/scripts/deploy-release.sh | cut -d: -f1)"
          wheelhouse_line="$(grep -nF '[[ -d "${SIGNED_WHEELHOUSE_ROOT}"' deploy/scripts/deploy-release.sh | cut -d: -f1)"
          offline_install_line="$(grep -nF '"${VENV_PYTHON}" -m pip install' deploy/scripts/deploy-release.sh | head -n 1 | cut -d: -f1)"
          test -n "${extract_line}" && test -n "${wheelhouse_line}" && test -n "${offline_install_line}"
          test "${verify_line}" -lt "${extract_line}"
          test "${extract_line}" -lt "${wheelhouse_line}"
          test "${wheelhouse_line}" -lt "${offline_install_line}"
          grep -Fq 'User=finguard' deploy/systemd/finguard-api.service
          grep -Fq -- '--host 127.0.0.1' deploy/systemd/finguard-api.service
          if grep -REn '^[[:space:]]*uses:' .github/workflows | \
            grep -Ev '@[0-9a-f]{40}([[:space:]]+#.*)?$'; then
            echo 'Workflow actions must be pinned to full commit SHAs.' >&2
            exit 1
          fi
          if git grep -IlE \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AIza[0-9A-Za-z_-]{30,})' \
            -- . \
            ':(exclude)FinGuard.pdf' \
            ':(exclude).tools/**' \
            ':(exclude)frontend/.dart_tool/**' \
            ':(exclude)frontend/build/**' \
            ':(exclude)backend/build/**'; then
            echo 'Potential private key or Gemini API key found in tracked project files.' >&2
            exit 1
          fi

      - name: Verify release signature contract
        run: |
          set -Eeuo pipefail
          test_root="$(mktemp -d)"
          trap 'rm -rf -- "${test_root}"' EXIT
          ssh-keygen -q -t ed25519 -N '' -f "${test_root}/signing"
          ssh-keygen -q -t ed25519 -N '' -f "${test_root}/wrong"
          printf 'signed release fixture\n' >"${test_root}/release.tgz"
          printf 'finguard-ci %s\n' "$(cut -d ' ' -f 1-2 "${test_root}/signing.pub")" \
            >"${test_root}/allowed_signers"
          printf 'finguard-ci %s\n' "$(cut -d ' ' -f 1-2 "${test_root}/wrong.pub")" \
            >"${test_root}/wrong_allowed_signers"

          ssh-keygen -Y sign \
            -f "${test_root}/signing" \
            -n finguard-release \
            "${test_root}/release.tgz"
          ssh-keygen -Y verify \
            -f "${test_root}/allowed_signers" \
            -I finguard-ci \
            -n finguard-release \
            -s "${test_root}/release.tgz.sig" \
            <"${test_root}/release.tgz"

          if ssh-keygen -Y verify \
            -f "${test_root}/wrong_allowed_signers" \
            -I finguard-ci \
            -n finguard-release \
            -s "${test_root}/release.tgz.sig" \
            <"${test_root}/release.tgz"; then
            echo 'A release unexpectedly passed verification with the wrong key.' >&2
            exit 1
          fi
          printf 'mutated\n' >>"${test_root}/release.tgz"
          if ssh-keygen -Y verify \
            -f "${test_root}/allowed_signers" \
            -I finguard-ci \
            -n finguard-release \
            -s "${test_root}/release.tgz.sig" \
            <"${test_root}/release.tgz"; then
            echo 'A mutated release unexpectedly passed signature verification.' >&2
            exit 1
          fi
