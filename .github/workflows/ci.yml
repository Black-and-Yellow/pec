name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --editable ".[dev]"
          python -m pip check

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run backend tests
        run: python -m pytest

  flutter:
    name: Flutter analyze, tests, and release builds
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Flutter web
        run: flutter build web --release

      - name: Build Android APK
        run: flutter build apk --release

  deployment-assets:
    name: Deployment asset checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate Bash scripts
        run: bash -n deploy/scripts/*.sh deploy/certbot/*.sh

      - name: Validate deployment templates
        run: |
          set -Eeuo pipefail
          grep -Fq '__FINGUARD_DOMAIN__' deploy/nginx/finguard-https.conf.template
          for config in \
            deploy/nginx/finguard-http.conf \
            deploy/nginx/finguard-https.conf.template; do
            grep -Fq 'proxy_pass http://127.0.0.1:8000;' "${config}"
            grep -Fq 'limit_req zone=finguard_api_per_ip' "${config}"
            grep -Fq 'limit_req zone=finguard_auth_per_ip' "${config}"
          done
          grep -Fq 'User=finguard' deploy/systemd/finguard-api.service
          grep -Fq -- '--host 127.0.0.1' deploy/systemd/finguard-api.service
          if git grep -IlE \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AIza[0-9A-Za-z_-]{30,})' \
            -- . \
            ':(exclude)FinGuard.pdf' \
            ':(exclude).tools/**' \
            ':(exclude)frontend/.dart_tool/**' \
            ':(exclude)frontend/build/**' \
            ':(exclude)backend/build/**'; then
            echo 'Potential private key or Gemini API key found in tracked project files.' >&2
            exit 1
          fi
