[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finguard-backend"
version = "0.1.0"
description = "Explainable pre-payment UPI risk API for FinGuard"
requires-python = ">=3.11"
dependencies = [
  "email-validator==2.3.0",
  "fastapi==0.141.1",
  "google-auth==2.56.3",
  "httpx==0.28.1",
  "PyJWT==2.13.0",
  "pydantic==2.13.4",
  "pwdlib[argon2]==0.3.0",
  "python-dotenv==1.2.2",
  "requests==2.34.2",
  "sqlalchemy==2.0.51",
  "uvicorn==0.52.1",
]

[project.optional-dependencies]
dev = [
  "mypy==1.20.2",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
python_version = "3.11"
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
