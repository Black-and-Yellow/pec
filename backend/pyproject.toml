[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finguard-backend"
version = "0.1.0"
description = "Explainable pre-payment UPI risk API for FinGuard"
requires-python = ">=3.11"
dependencies = [
  "email-validator>=2.2,<3",
  "fastapi>=0.111,<1",
  "google-auth>=2.38,<3",
  "httpx>=0.27,<1",
  "PyJWT>=2.10,<3",
  "pydantic>=2.7,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0.31,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
